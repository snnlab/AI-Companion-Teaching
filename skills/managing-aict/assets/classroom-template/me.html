<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>My feedback</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    margin: 0; background: #f6f7f9; color: #1c1917;
  }
  main { max-width: 980px; margin: 0 auto; padding: .75rem 1rem .5rem; }
  #pushbar { max-width: 980px; margin: 0 auto 4rem; padding: 0 1rem; }
  h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
  .muted { color: #78716c; font-size: .9rem; }
  .card {
    background: #fff; border: 1px solid #e7e5e4; border-radius: 12px;
    padding: 1rem 1.1rem; margin-top: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  .badge {
    display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .02em;
    padding: .12rem .5rem; border-radius: 999px; background: #dbeafe; color: #1d4ed8;
    border: 1px solid #bfdbfe; text-transform: uppercase;
  }
  .done { background: #dcfce7; color: #15803d; border-color: #bbf7d0; }
  .comment { border-top: 1px solid #f0efed; padding: .8rem 0 .2rem; }
  .comment:first-of-type { border-top: 0; }
  .comment .where { font-size: .8rem; color: #78716c; margin-bottom: .3rem; }
  .comment blockquote {
    margin: .3rem 0; padding: .3rem .7rem; border-left: 3px solid #d6d3d1;
    color: #57534e; font-size: .9rem; white-space: pre-wrap;
  }
  .comment .body { white-space: pre-wrap; }
  .comment .by { font-size: .78rem; color: #a8a29e; margin-top: .3rem; }
  form { background: #fff; padding: 1.5rem; border-radius: 12px; box-shadow: 0 1px 8px rgba(0,0,0,.08); margin-top: 1rem; }
  label { display: block; font-size: .85rem; color: #444; margin-bottom: .4rem; }
  input[type=text] {
    width: 100%; font-size: 1rem; padding: .65rem; border: 1px solid #ccc;
    border-radius: 8px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  button {
    font-size: .95rem; padding: .6rem 1rem; border: 0; border-radius: 8px;
    background: #2563eb; color: #fff; cursor: pointer;
  }
  button.ghost { background: transparent; color: #2563eb; padding: .4rem .3rem; }
  .row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin-top: 1rem; }
  .err { color: #b91c1c; font-size: .85rem; margin-top: .6rem; }
  .empty { text-align: center; padding: 2.5rem 1rem; }
  .empty p { margin: .3rem 0; }
  #pushbar:empty { display: none; }
  .pushbar {
    background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 10px;
    padding: .7rem .9rem; margin-top: 1rem; font-size: .88rem;
    display: flex; flex-wrap: wrap; align-items: center; gap: .6rem;
  }
  .pushbar.on { background: #f0fdf4; border-color: #bbf7d0; }
  .pushbar .grow { flex: 1 1 auto; min-width: 12rem; color: #57534e; }
  .pushbar button { font-size: .82rem; padding: .45rem .8rem; }
  .pushbar button.off { background: transparent; color: #78716c; border: 1px solid #d6d3d1; }
  .pushbar .testnote { flex-basis: 100%; font-size: .8rem; color: #57534e; }
  .pushbar .testnote:empty { display: none; }
  .pushhelp { margin-top: .5rem; font-size: .84rem; color: #57534e; }
  .pushhelp summary { cursor: pointer; color: #2563eb; }
  .pushhelp ul { margin: .4rem 0 0; padding-left: 1.2rem; }
  .pushhelp li { margin: .25rem 0; }
  .wait { background: #f5f5f4; color: #57534e; border-color: #e7e5e4; }
  #topbar { max-width: 980px; margin: 0 auto; padding: 1rem 1rem 0; }
  #topbar:empty { display: none; }
  .topbar { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; justify-content: flex-end; }
  .topbar button { font-size: .85rem; padding: .45rem .85rem; }
  .topbar button.plain { background: #fff; color: #1c1917; border: 1px solid #d6d3d1; }
  .topbar .pill {
    font-size: .8rem; color: #15803d; background: #f0fdf4; border: 1px solid #bbf7d0;
    border-radius: 999px; padding: .3rem .7rem;
  }
  .topbar .msg { flex-basis: 100%; text-align: right; font-size: .8rem; color: #b91c1c; }
  .topbar .msg:empty { display: none; }
  .layout { display: grid; grid-template-columns: 230px 1fr; gap: 1.25rem; align-items: start; margin-top: 1rem; }
  .side {
    position: sticky; top: 1rem; background: #fff; border: 1px solid #e7e5e4;
    border-radius: 12px; padding: .5rem;
  }
  .side-item {
    display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: .4rem;
    padding: .55rem .65rem; border-radius: 8px; color: inherit; text-decoration: none;
  }
  .side-item:hover { background: #f5f5f4; }
  .side-item.active { background: #1c1917; color: #fff; }
  .side-item.active .s { color: #d6d3d1; }
  .side-item .t { font-weight: 600; font-size: .92rem; }
  .side-item .s { grid-column: 1 / -1; font-size: .76rem; color: #78716c; }
  .side-item .badge { font-size: .62rem; padding: .05rem .4rem; }
  .side-label {
    font-size: .72rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    color: #a8a29e; padding: .7rem .65rem .25rem; border-top: 1px solid #f0efed; margin-top: .35rem;
  }
  .side-note { font-size: .75rem; color: #a8a29e; margin: .5rem .65rem .25rem; }
  .pane { min-width: 0; }
  .pane h2 { font-size: 1.1rem; margin: 0; }
  .pane > .card:first-of-type { margin-top: .75rem; }
  .pane-head { display: flex; align-items: center; gap: .6rem; }
  .card-title { font-size: .8rem; font-weight: 700; color: #57534e; text-transform: uppercase; letter-spacing: .04em; }
  .board-cta { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; }
  .board-cta .muted { flex: 1 1 16rem; font-size: .85rem; }
  a.btn {
    display: inline-block; background: #2563eb; color: #fff; text-decoration: none;
    font-weight: 600; font-size: .92rem; padding: .55rem 1rem; border-radius: 8px;
  }
  a.btn:hover { background: #1d4ed8; }
  .tag-row { display: flex; align-items: center; gap: .5rem; margin-bottom: .2rem; }
  .tag-row a.vtag { font-weight: 700; font-size: .85rem; color: #1c1917; text-decoration: none; }
  .tag-row a.vtag:hover { text-decoration: underline; }
  .tag-row a.open {
    margin-left: auto; font-size: .78rem; font-weight: 600; color: #2563eb; text-decoration: none;
  }
  .tag-row a.open:hover { text-decoration: underline; }
  .foot { margin-top: 1rem; font-size: .82rem; }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    .side { position: static; }
  }
</style>
</head>
<body>
<div id="topbar"></div>
<main id="app"><p class="muted">Loading…</p></main>
<div id="pushbar"></div>

<script>
(function () {
  var TOKEN_KEY = "aict-me-token";
  var SEEN_PREFIX = "aict-me-seen:";
  var app = document.getElementById("app");

  function ls(op, key, val) {
    try {
      if (op === "get") return localStorage.getItem(key);
      if (op === "set") return localStorage.setItem(key, val);
      if (op === "del") return localStorage.removeItem(key);
    } catch (e) { return null; }
  }

  // One-time carry-over from the pre-AICT key names. Without it the rename
  // would log every student out of this page and mark all their released
  // feedback unread again, which reads as data loss rather than a rename.
  (function carryOverLegacyKeys() {
    try {
      var LEGACY_TOKEN = "pt-me-token";
      var LEGACY_SEEN = "pt-me-seen:";
      var old = localStorage.getItem(LEGACY_TOKEN);
      if (old && !localStorage.getItem(TOKEN_KEY)) localStorage.setItem(TOKEN_KEY, old);
      localStorage.removeItem(LEGACY_TOKEN);
      for (var i = localStorage.length - 1; i >= 0; i--) {
        var k = localStorage.key(i);
        if (!k || k.indexOf(LEGACY_SEEN) !== 0) continue;
        var nk = SEEN_PREFIX + k.slice(LEGACY_SEEN.length);
        if (!localStorage.getItem(nk)) localStorage.setItem(nk, localStorage.getItem(k));
        localStorage.removeItem(k);
      }
    } catch (e) { /* private mode or blocked storage: nothing to carry over */ }
  })();

  function el(tag, props, kids) {
    var n = document.createElement(tag);
    if (props) for (var k in props) {
      if (k === "class") n.className = props[k];
      else if (k === "text") n.textContent = props[k];
      else n.setAttribute(k, props[k]);
    }
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }

  function fmtDate(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d)) return String(iso).slice(0, 16).replace("T", " ");
    var p = function (x) { return String(x).padStart(2, "0"); };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
           " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  function clear() { while (app.firstChild) app.removeChild(app.firstChild); }

  function showTokenForm(message) {
    clear();
    renderTop(true);
    app.appendChild(el("h1", { text: "My feedback" }));
    app.appendChild(el("p", { class: "muted", text:
      "Read the feedback your instructor left on your submissions. Nothing to install — you only need the token you use to submit." }));
    var form = el("form");
    form.appendChild(el("label", { for: "tok", text: "Submission token (the one your instructor gave you for /ait:submit)" }));
    var input = el("input", { type: "text", id: "tok", autocomplete: "off",
      autocapitalize: "off", spellcheck: "false", placeholder: "e.g. 3f9a…" });
    form.appendChild(input);
    if (message) form.appendChild(el("p", { class: "err", text: message }));
    var btn = el("button", { type: "submit", text: "Continue" });
    form.appendChild(el("div", { class: "row" }, [btn]));
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var t = input.value.trim();
      if (!t) return;
      ls("set", TOKEN_KEY, t);
      load();
    });
    app.appendChild(form);
    input.focus();
  }

  function renderEmpty(studentId) {
    clear();
    app.appendChild(el("h1", { text: "My feedback" }));
    if (studentId) app.appendChild(el("p", { class: "muted", text: studentId }));
    var box = el("div", { class: "card empty" }, [
      el("p", { text: "No submissions yet." }),
      el("p", { class: "muted", text: "Each /ait:submit appears here as a version; feedback shows up once your instructor reviews it and sends it." }),
    ]);
    app.appendChild(box);
    app.appendChild(controls());
  }

  function controls() {
    var change = el("button", { type: "button", class: "ghost", text: "Change token" });
    change.addEventListener("click", function () { ls("del", TOKEN_KEY); showTokenForm(); });
    return el("div", { class: "row" }, [change]);
  }

  // ---- Web push opt-in -------------------------------------------------
  var pushbar = document.getElementById("pushbar");
  var pushStarted = false;

  // ---- Top bar: Refresh and the notification switch, always in reach ------
  // The same notification action as the bar at the bottom, so a student does
  // not have to scroll past every version to find it.
  var topbar = document.getElementById("topbar");
  var top = { push: "none", enable: null, msg: "" }; // push: none | off | on

  function renderTop(hidden) {
    while (topbar.firstChild) topbar.removeChild(topbar.firstChild);
    if (hidden) return;
    var kids = [];
    if (top.push === "on") {
      kids.push(el("span", { class: "pill", text: "🔔 Notifications on" }));
    } else if (top.push === "off" && top.enable) {
      var b = el("button", { type: "button", text: "🔔 Turn on notifications" });
      b.addEventListener("click", function () { b.disabled = true; top.enable(); });
      kids.push(b);
    }
    var r = el("button", { type: "button", class: "plain", text: "↻ Refresh" });
    r.addEventListener("click", load);
    kids.push(r);
    kids.push(el("span", { class: "msg", text: top.msg }));
    topbar.appendChild(el("div", { class: "topbar" }, kids));
  }

  function setTop(push, enable, msg) {
    top.push = push;
    top.enable = enable || null;
    top.msg = msg || "";
    renderTop();
  }

  function urlB64ToUint8Array(base64) {
    var padding = "=".repeat((4 - (base64.length % 4)) % 4);
    var b64 = (base64 + padding).replace(/-/g, "+").replace(/_/g, "/");
    var raw = atob(b64);
    var arr = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
    return arr;
  }

  function pushSupported() {
    return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
  }

  function setBar(kids, on) {
    while (pushbar.firstChild) pushbar.removeChild(pushbar.firstChild);
    if (!kids) return;
    var bar = el("div", { class: on ? "pushbar on" : "pushbar" }, kids);
    pushbar.appendChild(bar);
    pushbar.appendChild(pushHelp());
  }

  // Why a notification may not show, in the order students hit them.
  function pushHelp() {
    var items = [
      "Keep the browser running. Chrome and Whale receive notifications only while the browser is open (it can be minimized). In Chrome, turn on Settings → System → “Continue running background apps when Google Chrome is closed”; in Whale, the same option is under Settings → System. A notification sent while the browser was closed arrives when you open it again.",
      "Allow the browser in Windows: Settings → System → Notifications → Chrome (or Whale) on, and Do not disturb / Focus assist off. On a Mac: System Settings → Notifications → your browser.",
      "Allow this site: click the lock icon left of the address and set Notifications to Allow.",
      "Use “Send a test notification” above to check. If the test arrives, feedback notifications will too.",
      "Notifications are per browser and per device. Turn them on in each browser you use.",
    ];
    return el("details", { class: "pushhelp" }, [
      el("summary", { text: "Not getting notifications?" }),
      el("ul", null, items.map(function (t) { return el("li", { text: t }); })),
    ]);
  }

  function sameKey(sub, appKey) {
    try {
      var k = sub.options && sub.options.applicationServerKey;
      if (!k) return true; // the browser does not say: keep it
      var a = new Uint8Array(k);
      if (a.length !== appKey.length) return false;
      for (var i = 0; i < a.length; i++) if (a[i] !== appKey[i]) return false;
      return true;
    } catch (e) { return true; }
  }

  function postSub(token, sub) {
    return fetch("/api/push-subscribe", {
      method: "POST",
      headers: { Authorization: "Bearer " + token, "content-type": "application/json" },
      body: JSON.stringify(sub.toJSON ? sub.toJSON() : sub),
    });
  }

  async function subscribe(reg, appKey, token) {
    // A subscription made with a *different* key blocks a new subscribe
    // (InvalidStateError) — drop it first.
    var stale = await reg.pushManager.getSubscription();
    if (stale) { try { await stale.unsubscribe(); } catch (e) { /* ignore */ } }
    var sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: appKey });
    var res = await postSub(token, sub);
    if (!res.ok) throw new Error("the server refused the subscription (HTTP " + res.status + ")");
    return sub;
  }

  function testButton(token) {
    var note = el("span", { class: "testnote" });
    var btn = el("button", { type: "button", class: "off", text: "Send a test notification" });
    btn.addEventListener("click", async function () {
      btn.disabled = true;
      note.textContent = "Sending…";
      try {
        var r = await fetch("/api/push-subscribe?test=1", {
          method: "POST", headers: { Authorization: "Bearer " + token },
        });
        var j = await r.json().catch(function () { return {}; });
        if (r.ok && j.sent > 0) {
          note.textContent = "Sent to " + j.sent + " device" + (j.sent === 1 ? "" : "s") +
            ". Nothing within a minute? See “Not getting notifications?” below.";
        } else if (r.ok) {
          note.textContent = "The server has no device registered for you. Turn notifications off and on again.";
        } else {
          note.textContent = "The test could not be sent (" + (j.error || "HTTP " + r.status) + ").";
        }
      } catch (e) {
        note.textContent = "Couldn’t reach the server. Try again in a moment.";
      }
      btn.disabled = false;
    });
    return [btn, note];
  }

  async function initPush() {
    if (!pushSupported()) { setTop("none"); return; }
    var token = ls("get", TOKEN_KEY);
    if (!token) { setBar(null); return; }

    var keyRes = await fetch("/api/vapid-public-key").then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
    if (!keyRes || !keyRes.key) { setBar(null); setTop("none"); return; } // push not configured on this server

    var reg = await navigator.serviceWorker.register("/sw.js").catch(function () { return null; });
    if (!reg) { setBar(null); setTop("none"); return; }

    var appKey = null, keyError = null;
    try {
      appKey = urlB64ToUint8Array(keyRes.key);
      if (appKey.length !== 65) throw new Error("the server's VAPID_PUBLIC_KEY is " + appKey.length + " bytes (65 needed) — your instructor must reset the key and redeploy.");
    } catch (e) {
      console.error("[push] bad applicationServerKey:", e);
      keyError = "The notification key is misconfigured: " + (e && e.message ? e.message : e);
    }

    var existing = await reg.pushManager.getSubscription();
    if (existing && Notification.permission === "granted" && appKey) {
      // Self-heal on every visit. The server forgets a subscription the push
      // service reported gone, and the browser may have replaced it, so
      // "on" in this browser does not mean the server can reach it.
      // Registering again is idempotent; a subscription made under an
      // older key is replaced.
      try {
        if (!sameKey(existing, appKey)) existing = await subscribe(reg, appKey, token);
        else await postSub(token, existing);
      } catch (e) {
        console.error("[push] re-register failed:", e);
      }
    }

    if (existing && Notification.permission === "granted") {
      var offBtn = el("button", { type: "button", class: "off", text: "Turn off notifications" });
      offBtn.addEventListener("click", async function () {
        offBtn.disabled = true;
        try {
          await fetch("/api/push-subscribe", {
            method: "DELETE",
            headers: { Authorization: "Bearer " + token, "content-type": "application/json" },
            body: JSON.stringify({ endpoint: existing.endpoint }),
          });
          await existing.unsubscribe();
        } catch (e) { /* ignore */ }
        initPush();
      });
      var test = testButton(token);
      setBar([el("span", { class: "grow", text: "New-feedback notifications are on in this browser." }), test[0], offBtn, test[1]], true);
      setTop("on");
      return;
    }

    var onBtn = el("button", { type: "button", text: "🔔 Notify me of new feedback" });
    var note = el("span", { class: "grow", text: keyError || "Get a notification on this device when your instructor sends feedback. (You only allow it once.)" });
    // One action for both buttons (here and in the top bar); a problem is
    // reported in both places.
    function fail(text) {
      note.textContent = text;
      onBtn.disabled = false;
      setTop("off", enable, text);
    }
    async function enable() {
      if (keyError) return fail(keyError);
      onBtn.disabled = true;
      var perm = Notification.permission === "granted" ? "granted" : await Notification.requestPermission();
      if (perm !== "granted") {
        return fail("Notifications are blocked in this browser. Allow them from the lock icon in the address bar.");
      }
      try {
        await subscribe(reg, appKey, token);
      } catch (e) {
        console.error("[push] subscribe failed:", e);
        var name = e && e.name ? e.name + ": " : "";
        return fail("Couldn’t turn on notifications — " + name + (e && e.message ? e.message : "try again in a moment."));
      }
      initPush();
    }
    onBtn.addEventListener("click", enable);
    if (keyError) onBtn.disabled = true;
    setBar([note, onBtn], false);
    setTop(keyError ? "none" : "off", enable);
  }

  var VIEWS = { tracker: "Tracker", timeline: "Timeline", reports: "Reports",
    reviews: "Reviews", archive: "Archive", plans: "Analysis plans",
    results: "Output & validation", manuscript: "Manuscript" };

  function commentWhere(a) {
    if (!a || typeof a !== "object") return "General comment";
    // The manuscript's sectionHeading is the literal "manuscript" — say where
    // it is instead.
    if (a.view === "manuscript") return "Manuscript";
    if (a.sectionHeading) return a.sectionHeading;
    if (a.component) {
      return a.component + (a.version != null ? " · plan v" + a.version
        : a.resultsVersion != null ? " · results r" + a.resultsVersion : "");
    }
    if (a.view) return VIEWS[a.view] || a.view;
    return "General comment";
  }

  function renderComment(c) {
    var a = c.annotation || {};
    var node = el("div", { class: "comment" });
    node.appendChild(el("div", { class: "where", text: commentWhere(a) }));
    if (a.quote) node.appendChild(el("blockquote", { text: a.quote }));
    node.appendChild(el("div", { class: "body", text: a.comment || "" }));
    var by = [c.author || "Instructor", fmtDate(c.receivedAt),
      c.editedAt ? "edited " + fmtDate(c.editedAt) : ""].filter(Boolean).join(" · ");
    node.appendChild(el("div", { class: "by", text: by }));
    return node;
  }

  function when(s) {
    var t = Date.parse(s.submittedAt || "");
    return isNaN(t) ? 0 : t;
  }

  // Version N = the submission's place among ALL of the student's
  // submissions, oldest = 1, so a number never changes once given (the
  // history board and /ait:check --history count the same way).
  function versionNumbers(subs) {
    var n = {};
    subs.slice().sort(function (x, y) { return when(x) - when(y); })
      .forEach(function (s, i) { n[s.shareHash] = i + 1; });
    return n;
  }

  var TITLE = "My feedback";
  var lastData = null;

  function boardHref(s) { return "/me/board?key=" + encodeURIComponent(s.shareHash); }

  function isNewSub(s) {
    if (!s.releasedAt) return false;
    var seenAt = ls("get", SEEN_PREFIX + s.shareHash);
    return !seenAt || seenAt < s.releasedAt;
  }

  // The selection lives in the address (#all, #v3), so Back works and a
  // reload or bookmark reopens the same version.
  function selectedSub(num, subs) {
    var m = /^#v(\d+)$/.exec(location.hash || "");
    if (!m) return null;
    for (var i = 0; i < subs.length; i++) if (num[subs[i].shareHash] === Number(m[1])) return subs[i];
    return null;
  }

  function sideItem(href, title, sub, badge, active) {
    var a = el("a", { class: active ? "side-item active" : "side-item", href: href }, [
      el("span", { class: "t", text: title }),
      badge,
      el("span", { class: "s", text: sub }),
    ]);
    if (active) a.setAttribute("aria-current", "page");
    return a;
  }

  function statusBadge(s) {
    if (!s.releasedAt) return el("span", { class: "badge wait", text: "Waiting" });
    if (isNewSub(s)) return el("span", { class: "badge", text: "New" });
    return el("span", { class: "badge done", text: "Reviewed" });
  }

  function render(data) { lastData = data; draw(); }
  window.addEventListener("hashchange", function () { if (lastData) { draw(); window.scrollTo(0, 0); } });

  function draw() {
    var data = lastData;
    var comments = Array.isArray(data.comments) ? data.comments : [];
    var subs = (Array.isArray(data.submissions) ? data.submissions : [])
      .slice().sort(function (x, y) { return when(y) - when(x); });

    if (subs.length === 0) { renderEmpty(data.studentId); return; }
    var num = versionNumbers(subs);
    var sel = selectedSub(num, subs);
    var anyNew = subs.some(isNewSub);

    clear();
    app.appendChild(el("h1", { text: "My feedback" }));
    app.appendChild(el("p", { class: "muted", text: data.studentId || "" }));

    // ---- Left panel: All feedback, then every version, newest first
    var side = el("nav", { class: "side", "aria-label": "Versions" });
    side.appendChild(sideItem("#all", "All feedback",
      comments.length + " comment" + (comments.length === 1 ? "" : "s"),
      anyNew ? el("span", { class: "badge", text: "New" }) : null, !sel));
    side.appendChild(el("div", { class: "side-label", text: "Versions" }));
    subs.forEach(function (s) {
      side.appendChild(sideItem("#v" + num[s.shareHash], "Version " + num[s.shareHash],
        "submitted " + fmtDate(s.submittedAt), statusBadge(s), sel === s));
    });
    side.appendChild(el("p", { class: "side-note", text: "Each /ait:submit is a new version." }));

    // ---- Right: the selected view
    var pane = el("section", { class: "pane" });
    var shown = {};
    if (!sel) {
      drawAll(pane, subs, num, comments);
      subs.forEach(function (s) { if (s.releasedAt) shown[s.shareHash] = s.releasedAt; });
    } else if (!sel.releasedAt) {
      drawWaiting(pane, sel, num[sel.shareHash]);
    } else {
      drawVersion(pane, sel, num[sel.shareHash], comments);
      shown[sel.shareHash] = sel.releasedAt;
    }
    app.appendChild(el("div", { class: "layout" }, [side, pane]));
    app.appendChild(controls());
    document.title = anyNew ? "(New) " + TITLE : TITLE;

    // Mark what was shown as seen so its "New" badge clears on the next
    // visit (until the instructor sends again, which moves releasedAt). Only
    // while the page is actually in front of the student: a background
    // refresh must not swallow the badge.
    markSeenWhenVisible(shown, subs);
  }

  function drawAll(pane, subs, num, comments) {
    pane.appendChild(el("h2", { text: "All feedback" }));
    var bySub = {};
    subs.forEach(function (s) { bySub[s.shareHash] = s; });
    var all = comments.filter(function (c) { return bySub[c.shareHash]; })
      .sort(function (x, y) { return (y.receivedAt || "").localeCompare(x.receivedAt || ""); });
    if (all.length === 0) {
      var reviewed = subs.some(function (s) { return s.releasedAt; });
      pane.appendChild(el("div", { class: "card empty" }, [
        el("p", { text: reviewed ? "No comments yet." : "No feedback yet." }),
        el("p", { class: "muted", text: reviewed
          ? "Your reviewed versions have no comments."
          : "Feedback appears here once your instructor reviews a version and sends it." }),
      ]));
      return;
    }
    pane.appendChild(el("p", { class: "muted", text: "Every comment your instructor has sent, newest first." }));
    all.forEach(function (c) {
      var s = bySub[c.shareHash];
      var n = num[s.shareHash];
      var card = el("div", { class: "card" }, [
        el("div", { class: "tag-row" }, [
          el("a", { class: "vtag", href: "#v" + n, text: "Version " + n }),
          isNewSub(s) ? el("span", { class: "badge", text: "New" }) : null,
          el("a", { class: "open", href: boardHref(s), text: "See it in place" }),
        ]),
        renderComment(c),
      ]);
      pane.appendChild(card);
    });
    pane.appendChild(el("p", { class: "muted foot", text:
      "To bring the feedback into your Claude session, run /ait:check in your project directory (/ait:check --history lists every reviewed version)." }));
  }

  function drawVersion(pane, s, n, comments) {
    var mine = comments.filter(function (c) { return c.shareHash === s.shareHash; })
      .sort(function (x, y) { return (x.receivedAt || "").localeCompare(y.receivedAt || ""); });
    pane.appendChild(el("div", { class: "pane-head" }, [
      el("h2", { text: "Version " + n }),
      statusBadge(s),
    ]));
    pane.appendChild(el("p", { class: "muted", text:
      "submitted " + fmtDate(s.submittedAt) + " · feedback sent " + fmtDate(s.releasedAt) }));
    pane.appendChild(el("div", { class: "card board-cta" }, [
      el("a", { class: "btn", href: boardHref(s), text: "Open Version " + n + " →" }),
      el("span", { class: "muted", text:
        "This version exactly as your instructor reviewed it — manuscript, plans and results — with each comment highlighted in place." }),
    ]));
    var card = el("div", { class: "card" }, [
      el("div", { class: "card-title", text: mine.length + " comment" + (mine.length === 1 ? "" : "s") }),
    ]);
    if (mine.length === 0) card.appendChild(el("p", { class: "muted", text: "No comments on this version." }));
    mine.forEach(function (c) { card.appendChild(renderComment(c)); });
    pane.appendChild(card);
  }

  function drawWaiting(pane, s, n) {
    pane.appendChild(el("div", { class: "pane-head" }, [
      el("h2", { text: "Version " + n }),
      statusBadge(s),
    ]));
    pane.appendChild(el("p", { class: "muted", text: "submitted " + fmtDate(s.submittedAt) }));
    pane.appendChild(el("div", { class: "card empty" }, [
      el("p", { text: "Waiting for review." }),
      el("p", { class: "muted", text:
        "Your instructor has received this version but has not sent feedback on it yet. It opens here when they do — with notifications on, you get one." }),
    ]));
  }

  var pendingSeen = null;
  function markSeenWhenVisible(shown, subs) {
    pendingSeen = { shown: shown, subs: subs };
    var mine = pendingSeen;
    if (document.visibilityState !== "visible") return;
    setTimeout(function () {
      if (pendingSeen !== mine || document.visibilityState !== "visible") return;
      for (var k in shown) ls("set", SEEN_PREFIX + k, shown[k]);
      pendingSeen = null;
      document.title = subs.some(isNewSub) ? "(New) " + TITLE : TITLE;
    }, 1200);
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible") return;
    if (pendingSeen) markSeenWhenVisible(pendingSeen.shown, pendingSeen.subs);
    refreshQuietly();
  });

  // ---- Background refresh -------------------------------------------------
  // While this page is open it checks for new feedback every two minutes, so
  // feedback shows up here (with "(New)" in the tab title) even when a push
  // notification did not arrive.
  var REFRESH_MS = 2 * 60 * 1000;
  var lastSignature = null;
  var refreshTimer = null;

  function signature(data) {
    var subs = (data.submissions || []).map(function (s) { return s.shareHash + ":" + (s.releasedAt || ""); });
    var cs = (data.comments || []).map(function (c) { return c.id + ":" + (c.editedAt || ""); });
    return subs.sort().join(",") + "|" + cs.sort().join(",");
  }

  function fetchMine(token) {
    return fetch("/api/my-comments", { headers: { Authorization: "Bearer " + token } });
  }

  function refreshQuietly() {
    var token = ls("get", TOKEN_KEY);
    if (!token || lastSignature === null) return;
    fetchMine(token)
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (!data) return;
        var sig = signature(data);
        if (sig !== lastSignature) { lastSignature = sig; render(data); }
      })
      .catch(function () { /* offline for a moment: try again next round */ });
  }

  function load() {
    var token = ls("get", TOKEN_KEY);
    if (!token) { setBar(null); showTokenForm(); return; }
    clear();
    app.appendChild(el("p", { class: "muted", text: "Loading…" }));
    fetchMine(token)
      .then(function (r) {
        if (r.status === 401) { ls("del", TOKEN_KEY); showTokenForm("That token is wrong or has expired. Ask your instructor for a new one and enter it again."); return null; }
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (data) {
        if (!data) return;
        lastSignature = signature(data);
        render(data);
        renderTop();
        if (!pushStarted) { pushStarted = true; initPush(); }
        if (!refreshTimer) refreshTimer = setInterval(refreshQuietly, REFRESH_MS);
      })
      .catch(function () {
        clear();
        app.appendChild(el("h1", { text: "My feedback" }));
        app.appendChild(el("div", { class: "card empty" }, [
          el("p", { text: "Couldn’t reach the server." }),
          el("p", { class: "muted", text: "Try again in a moment." }),
        ]));
        app.appendChild(controls());
      });
  }

  load();
})();
</script>
</body>
</html>
